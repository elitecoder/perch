<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px} svg text.b{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">permission prompts</div><div class="h">Tap <em>Accept</em> on your phone, and the terminal gets Enter.</div>
<p class="cap">A hook marks the prompt, Perch posts buttons, and your tap becomes a keystroke in the pane.</p>
<svg viewBox="0 0 1104 1012" width="1104" height="1012" style="margin-top:28px">
<!-- actors -->
<rect class="f" x="10" y="0" width="200" height="64" rx="4"/><text class="s" x="110" y="28" text-anchor="middle">your phone</text><text class="t" x="110" y="52" text-anchor="middle">Slack</text>
<rect class="w" x="300" y="0" width="200" height="64" rx="4"/><text class="s" x="400" y="28" text-anchor="middle">Perch daemon</text><text class="t" x="400" y="52" text-anchor="middle">LaunchAgent</text>
<rect class="f" x="590" y="0" width="200" height="64" rx="4"/><text class="s" x="690" y="28" text-anchor="middle">hook files</text><text class="t" x="690" y="52" text-anchor="middle">~/.config/perch/</text>
<rect class="f" x="880" y="0" width="200" height="64" rx="4"/><text class="s" x="980" y="28" text-anchor="middle">terminal pane</text><text class="t" x="980" y="52" text-anchor="middle">claude</text>
<path class="thin d" d="M110 64 V330 M110 456 V770 M400 64 V770 M690 64 V770 M980 64 V104 M980 140 V770"/>

<!-- 1 prompt -->
<rect class="f" x="880" y="104" width="200" height="36" rx="4"/><text class="b" x="980" y="127" text-anchor="middle">Allow git commit?</text>
<!-- 2 hook writes -->
<path d="M980 196 H690"/><path d="M700 188 L690 196 L700 204"/>
<text x="835" y="186" text-anchor="middle">PermissionRequest</text>
<text class="t" x="835" y="222" text-anchor="middle">writes waiting/&lt;id&gt;.json</text>
<!-- 3 daemon reads -->
<path d="M690 276 H400"/><path d="M410 268 L400 276 L410 284"/>
<text x="545" y="266" text-anchor="middle">reads it</text>
<text class="t" x="545" y="302" text-anchor="middle">after 3 quiet seconds</text>
<!-- 4 posts buttons -->
<path d="M400 350 H224"/><path d="M234 342 L224 350 L234 358"/>
<text x="312" y="340" text-anchor="middle">posts</text>
<rect class="f" x="0" y="330" width="224" height="126" rx="6"/>
<text class="b" x="14" y="358">Waiting for approval</text>
<path d="M16 370 V390"/><text class="b" x="28" y="386">git commit</text>
<rect class="m" x="14" y="404" width="94" height="36" rx="4"/><text class="mt" x="61" y="428" text-anchor="middle">Accept</text>
<rect x="118" y="404" width="94" height="36" rx="4"/><text x="165" y="428" text-anchor="middle">Reject</text>
<!-- 5 tap -->
<circle class="mf" cx="110" cy="520" r="6"/>
<path class="m" d="M110 520 H398"/><path class="m" d="M388 511 L398 520 L388 529"/>
<text class="mt" x="255" y="508" text-anchor="middle">you tap Accept</text>
<!-- 6 keystroke -->
<path d="M400 590 H978"/><path d="M968 582 L978 590 L968 598"/>
<text x="545" y="580" text-anchor="middle">presses Enter</text>
<text class="t" x="545" y="616" text-anchor="middle">Reject presses Esc</text>
<!-- 7 message updated -->
<path d="M400 660 H110"/><path d="M120 652 L110 660 L120 668"/>
<text x="255" y="650" text-anchor="middle">message reads</text>
<text class="t" x="255" y="686" text-anchor="middle">Accepted</text>
<!-- 8 cleanup -->
<path d="M980 730 H690"/><path d="M700 722 L690 730 L700 738"/>
<text x="835" y="720" text-anchor="middle">PostToolUse</text>
<text class="t" x="835" y="756" text-anchor="middle">deletes the file</text>

<!-- other prompts -->
<text class="s" x="0" y="822">Other prompts work the same way.</text>
<text class="t" x="0" y="856">AskUserQuestion</text>
<rect class="f" x="0" y="868" width="340" height="140" rx="6"/>
<text class="b" x="14" y="896">Claude is asking:</text>
<path d="M16 908 V928"/><text class="b" x="28" y="924">Which database?</text>
<rect x="14" y="940" width="110" height="34" rx="4"/><text x="69" y="963" text-anchor="middle">Postgres</text>
<rect x="134" y="940" width="110" height="34" rx="4"/><text x="189" y="963" text-anchor="middle">SQLite</text>
<text class="t" x="14" y="996">Down once per option, then Enter</text>

<text class="t" x="382" y="856">ExitPlanMode</text>
<rect class="f" x="382" y="868" width="340" height="140" rx="6"/>
<text class="b" x="396" y="896">Exit Plan Mode</text>
<rect x="396" y="940" width="110" height="34" rx="4"/><text x="451" y="963" text-anchor="middle">Approve</text>
<rect x="516" y="940" width="110" height="34" rx="4"/><text x="571" y="963" text-anchor="middle">Reject</text>
<text class="t" x="396" y="996">Enter or Esc</text>

<text class="t" x="764" y="856">Notification</text>
<rect class="f" x="764" y="868" width="340" height="140" rx="6"/>
<text class="b" x="778" y="896">Claude needs your attention</text>
<rect x="778" y="940" width="110" height="34" rx="4"/><text x="833" y="963" text-anchor="middle">Continue</text>
<rect x="898" y="940" width="110" height="34" rx="4"/><text x="953" y="963" text-anchor="middle">Cancel</text>
<text class="t" x="778" y="996">Enter or Esc</text>
</svg></div></body></html>
