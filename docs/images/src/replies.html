<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">replies in a watch thread</div><div class="h">What happens to <em>your reply</em>.</div>
<p class="cap">Perch checks each reply from top to bottom and acts on the first match.</p>
<svg viewBox="0 0 1104 650" width="1104" height="650" style="margin-top:28px">
<circle class="inkf" cx="24" cy="18" r="6"/><text class="t" x="44" y="24">your reply</text>
<path d="M24 24 V619"/>
<path d="M24 79 H46"/>
<text x="60" y="84">an image or file</text>
<path class="thin d" d="M228 79 H524"/><path class="thin" d="M516 72 L526 79 L516 86"/>
<text class="s" x="544" y="85">Downloads it; sends its path and your text to Claude</text>
<path d="M24 135 H46"/>
<text x="60" y="140">keys or help</text>
<path class="thin d" d="M189 135 H524"/><path class="thin" d="M516 128 L526 135 L516 142"/>
<text class="s" x="544" y="141">Lists the key words</text>
<path d="M24 191 H46"/>
<text x="60" y="196">new thread</text>
<path class="thin d" d="M170 191 H524"/><path class="thin" d="M516 184 L526 191 L516 198"/>
<text class="s" x="544" y="197">Moves the watch to a fresh thread and links to it</text>
<path d="M24 247 H46"/>
<text x="60" y="252">unwatch</text>
<path class="thin d" d="M141 247 H524"/><path class="thin" d="M516 240 L526 247 L516 254"/>
<text class="s" x="544" y="253">Stops the watch</text>
<path d="M24 303 H46"/>
<text x="60" y="308">!clear or .clear</text>
<path class="thin d" d="M228 303 H524"/><path class="thin" d="M516 296 L526 303 L516 310"/>
<text class="s" x="544" y="309">Sends the slash command /clear</text>
<path d="M24 359 H46"/>
<text x="60" y="364">accept, confirm, enter</text>
<path class="thin d" d="M285 359 H524"/><path class="thin" d="M516 352 L526 359 L516 366"/>
<rect class="f" x="544" y="342" width="76" height="34" rx="5"/><text x="582" y="364" text-anchor="middle">Enter</text>
<path d="M24 407 H46"/>
<text x="60" y="412">reject, esc, escape</text>
<path class="thin d" d="M256 407 H524"/><path class="thin" d="M516 400 L526 407 L516 414"/>
<rect class="f" x="544" y="390" width="57" height="34" rx="5"/><text x="572" y="412" text-anchor="middle">Esc</text>
<path d="M24 455 H46"/>
<text x="60" y="460">interrupt</text>
<path class="thin d" d="M160 455 H524"/><path class="thin" d="M516 448 L526 455 L516 462"/>
<rect class="f" x="544" y="438" width="86" height="34" rx="5"/><text x="587" y="460" text-anchor="middle">Ctrl-C</text>
<path d="M24 503 H46"/>
<text x="60" y="508">expand</text>
<path class="thin d" d="M132 503 H524"/><path class="thin" d="M516 496 L526 503 L516 510"/>
<rect class="f" x="544" y="486" width="86" height="34" rx="5"/><text x="587" y="508" text-anchor="middle">Ctrl-O</text>
<path d="M24 551 H46"/>
<text x="60" y="556">tab, up, down, left, right, space</text>
<path class="thin d" d="M391 551 H524"/><path class="thin" d="M516 544 L526 551 L516 558"/>
<rect class="f" x="544" y="534" width="105" height="34" rx="5"/><text x="596" y="556" text-anchor="middle">same key</text>
<path d="M24 619 H46"/>
<text x="60" y="624">anything else</text>
<path class="m" d="M199 619 H524"/><path class="m" d="M516 612 L526 619 L516 626"/>
<text class="s mt" x="544" y="625" style="fill:var(--mark)">Typed into the pane as a prompt, then Enter</text>
<path class="thin" d="M700 343 H712 V557 H700"/>
<text class="si" x="726" y="466">presses a key</text>
</svg></div></body></html>
