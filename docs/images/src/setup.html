<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">perch setup</div><div class="h">Ten stops from install to <em>connected</em>.</div>
<p class="cap">Rerun setup any time; it keeps the tokens already in Keychain and offers to keep your channel.</p>
<svg viewBox="0 0 1104 330" width="1104" height="330" style="margin-top:32px">
<path d="M100 60 H980 Q1080 60 1080 110 V130 Q1080 180 1030 180 H150 Q100 180 100 230 V240 H980"/>
<circle class="f" cx="100" cy="60" r="15"/><text x="100" y="65" text-anchor="middle">1</text>
<text class="s" x="100" y="106" text-anchor="middle">Claude Code</text>
<text class="t" x="100" y="132" text-anchor="middle">checks it's installed</text>
<circle class="f" cx="320" cy="60" r="15"/><text x="320" y="65" text-anchor="middle">2</text>
<text class="s" x="320" y="106" text-anchor="middle">multiplexer</text>
<text class="t" x="320" y="132" text-anchor="middle">finds tmux or cmux</text>
<circle class="f d" cx="540" cy="60" r="15"/><text x="540" y="65" text-anchor="middle">3</text>
<text class="s" x="540" y="106" text-anchor="middle">Automation Mode</text>
<text class="t" x="540" y="132" text-anchor="middle">cmux only</text>
<circle class="f" cx="760" cy="60" r="15"/><text x="760" y="65" text-anchor="middle">4</text>
<text class="s" x="760" y="106" text-anchor="middle">Slack app</text>
<text class="t" x="760" y="132" text-anchor="middle">paste the manifest</text>
<circle class="f" cx="980" cy="60" r="15"/><text x="980" y="65" text-anchor="middle">5</text>
<text class="s" x="980" y="106" text-anchor="middle">bot token</text>
<text class="t" x="980" y="132" text-anchor="middle">xoxb-, to Keychain</text>
<circle class="f" cx="100" cy="240" r="15"/><text x="100" y="245" text-anchor="middle">6</text>
<text class="s" x="100" y="286" text-anchor="middle">app token</text>
<text class="t" x="100" y="312" text-anchor="middle">xapp-, to Keychain</text>
<circle class="mf" cx="320" cy="240" r="15"/><text x="320" y="245" text-anchor="middle" style="fill:var(--paper)">7</text>
<text class="s" x="320" y="286" text-anchor="middle">channel ID</text>
<text class="t mt" x="320" y="312" text-anchor="middle" style="fill:var(--mark)">invite the bot first</text>
<circle class="f" cx="540" cy="240" r="15"/><text x="540" y="245" text-anchor="middle">8</text>
<text class="s" x="540" y="286" text-anchor="middle">hooks</text>
<text class="t" x="540" y="312" text-anchor="middle">Claude Code settings</text>
<circle class="f d" cx="760" cy="240" r="15"/><text x="760" y="245" text-anchor="middle">9</text>
<text class="s" x="760" y="286" text-anchor="middle">cmux skill</text>
<text class="t" x="760" y="312" text-anchor="middle">cmux only</text>
<circle class="f" cx="980" cy="240" r="15"/><text x="980" y="245" text-anchor="middle">10</text>
<text class="s" x="980" y="286" text-anchor="middle">LaunchAgent</text>
<text class="t" x="980" y="312" text-anchor="middle">starts the daemon</text>
