<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px} svg text.b{font-size:15px}</style></head>
<body><div id="fig" style="width:1160px">
<div class="k">a watch thread</div><div class="h">Your session, <em>in a thread</em>.</div>
<p class="cap">Your replies go to Claude, and Claude's work streams back as it happens.</p>
<svg viewBox="0 0 1064 852" width="1064" height="852" style="margin-top:28px">
<!-- phone -->
<rect class="f" x="2" y="2" width="436" height="846" rx="36"/>
<path d="M190 22 H250"/>
<text class="s" x="30" y="66">Thread</text><text class="t" x="104" y="66">#perch</text>
<path class="thin" d="M2 86 H438"/>

<!-- parent -->
<text x="30" y="122">perch</text>
<text class="b" x="30" y="148">Watching 5 with Claude Code —</text>
<text class="b" x="30" y="170">replies here will be forwarded</text>
<text class="b" x="30" y="192">to the pane.</text>
<text class="t" x="30" y="214">Keys: accept, reject, interrupt, …</text>
<!-- context -->
<text class="b" x="30" y="254">Context so far:</text>
<text class="b" x="30" y="276">Last prompt: fix the flaky test</text>
<text class="b" x="30" y="298">Last response: found it</text>
<text class="b" x="30" y="334">Started watching 5</text>
<path class="thin faint" d="M30 354 H410"/>
<!-- you -->
<text x="30" y="386">you</text>
<text class="b" x="30" y="412">please fix the login bug</text>
<rect class="thin" x="30" y="426" width="96" height="28" rx="14"/><text class="t" x="42" y="445">:wrench:</text>
<path class="thin faint" d="M30 474 H410"/>
<!-- status -->
<text x="30" y="506">perch</text>
<text class="b" x="30" y="532">Reading auth.ts</text>
<text class="b" x="30" y="554">Editing auth.ts</text>
<text class="b" x="30" y="576">Running: npm test (×2)</text>
<!-- reply -->
<text class="b" x="30" y="614">The check compared seconds</text>
<text class="b" x="30" y="636">with milliseconds. Fixed. ▌</text>
<!-- approval -->
<text class="b" x="30" y="676">Waiting for approval</text>
<path d="M32 688 V708"/><text class="b" x="44" y="704">git commit</text>
<rect class="m" x="30" y="722" width="112" height="38" rx="5"/><text class="mt" x="58" y="747">Accept</text>
<rect x="154" y="722" width="112" height="38" rx="5"/><text x="182" y="747">Reject</text>
<!-- reply box -->
<rect class="thin" x="22" y="788" width="396" height="42" rx="8"/><text class="t" x="38" y="815">Reply…</text>

<!-- callouts -->
<path class="thin" d="M452 166 H486"/>
<text class="s" x="500" y="172">Typing watch 5 opens a thread for that session.</text>
<path class="thin" d="M452 270 H486"/>
<text class="s" x="500" y="276">It starts with the last prompt and reply.</text>
<path class="thin" d="M452 440 H486"/>
<text class="s" x="500" y="434">A reaction on your latest message shows what</text>
<text class="s" x="500" y="458">Claude is doing: thinking, tools, replying, done.</text>
<text class="t" x="500" y="484">hourglass after 10 s quiet, warning after 30 s</text>
<path class="thin" d="M452 554 H486"/>
<text class="s" x="500" y="550">One status message lists tool calls, edited</text>
<text class="s" x="500" y="574">in place. Back-to-back repeats show a count.</text>
<path class="thin" d="M452 626 H486"/>
<text class="s" x="500" y="632">Claude's reply streams in until the turn ends.</text>
<path class="m" d="M452 741 H486"/>
<text class="s" x="500" y="738">Buttons appear when Claude waits for you.</text>
<text class="t" x="500" y="764">Accept presses Enter in the pane; Reject presses Esc.</text>
</svg></div></body></html>
