<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">how it works</div><div class="h">Your Mac <em>dials out</em>. Slack never dials in.</div>
<p class="cap">Perch reads Claude's transcript and hook files, posts to Slack, and types your replies into the terminal.</p>
<svg viewBox="0 0 1104 474" width="1104" height="474" style="margin-top:28px">
<!-- the Mac -->
<rect x="1" y="1" width="719" height="470" rx="8"/>
<text class="s" x="24" y="38">your Mac</text>

<!-- terminal pane -->
<rect class="f" x="30" y="180" width="230" height="130" rx="4"/>
<path d="M30 206 H260"/>
<circle cx="46" cy="193" r="3"/><circle cx="60" cy="193" r="3"/><circle cx="74" cy="193" r="3"/>
<text class="t" x="92" y="198">tmux or cmux pane</text>
<text x="48" y="242">$ claude</text>
<text class="t" x="48" y="272">Allow git commit?</text>

<!-- files -->
<rect class="f" x="280" y="50" width="200" height="80" rx="4"/>
<text class="s" x="294" y="82">transcript</text>
<text class="t" x="294" y="112">~/.claude/projects/</text>
<rect class="f" x="280" y="370" width="200" height="80" rx="4"/>
<text class="s" x="294" y="402">hook files</text>
<text class="t" x="294" y="432">~/.config/perch/</text>

<!-- daemon -->
<rect class="w" x="500" y="185" width="200" height="120" rx="4"/>
<text class="s" x="516" y="224">Perch daemon</text>
<text class="t" x="516" y="256">LaunchAgent,</text>
<text class="t" x="516" y="280">starts at login</text>

<!-- pane writes transcript -->
<path d="M110 180 V90 H280"/><path d="M270 82 L280 90 L270 98"/>
<text class="t" x="124" y="78">writes each turn</text>
<!-- transcript read by daemon -->
<path d="M480 90 H600 V185"/><path d="M592 175 L600 185 L608 175"/>
<text class="t" x="614" y="132">read every</text>
<text class="t" x="614" y="152">second</text>
<!-- pane runs hooks -->
<path d="M110 310 V410 H280"/><path d="M270 402 L280 410 L270 418"/>
<text class="t" x="124" y="398">hook scripts</text>
<!-- hooks read by daemon -->
<path d="M480 410 H600 V305"/><path d="M592 315 L600 305 L608 315"/>
<text class="t" x="614" y="352">checked</text>
<text class="t" x="614" y="372">when quiet</text>
<!-- daemon types into pane -->
<path d="M500 245 H260"/><path d="M270 237 L260 245 L270 253"/>
<text x="318" y="234">keys and text</text>
<text class="t" x="308" y="272">via tmux or cmux</text>

<!-- outbound connection -->
<circle class="mf" cx="700" cy="245" r="6"/>
<path class="m" d="M700 245 H858"/><path class="m" d="M848 236 L858 245 L848 254"/>
<text class="mt" x="742" y="212">outbound</text>
<text class="mt" x="737" y="232">WebSocket</text>
<text class="t" x="731" y="272">Socket Mode</text>

<!-- Slack -->
<rect class="d thin" x="860" y="60" width="243" height="380" rx="8"/>
<text class="s" x="880" y="96">Slack</text>
<rect class="f" x="920" y="120" width="124" height="280" rx="16"/>
<path d="M962 136 H1002"/>
<text class="t" x="936" y="172">#perch</text>
<path class="thin" d="M936 194 H1026 M936 212 H1004 M936 230 H1016"/>
<rect class="f" x="936" y="250" width="92" height="30" rx="4"/><text class="t" x="955" y="270">Accept</text>
<rect class="f" x="936" y="290" width="92" height="30" rx="4"/><text class="t" x="955" y="310">Reject</text>
<path class="thin" d="M936 346 H1022 M936 364 H996"/>
<text class="t" x="937" y="428">any device</text>

<text class="t" x="590" y="452">no open ports</text>
</svg></div></body></html>
