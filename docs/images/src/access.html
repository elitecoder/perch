<div class="k">who can control your sessions</div><div class="h">Anyone in your channel <em>can drive</em> your sessions.</div>
<p class="cap">Perch ignores other channels, direct messages, and bots, so use a private channel that only you belong to.</p>
<svg viewBox="0 0 1104 384" width="1104" height="384" style="margin-top:28px">
<text class="t" x="0" y="20">a Slack message from</text>
<text class="s" x="560" y="22" text-anchor="middle">Perch</text>
<path d="M556 34 V380 M564 34 V380"/>
<rect class="f" x="0" y="45" width="300" height="50" rx="6"/>
<text class="s" x="16" y="76">you</text><text class="t" x="284" y="75" text-anchor="end">in #perch</text>
<path class="" d="M300 70 H818"/><path class="" d="M808 62 L818 70 L808 78"/>
<rect class="f" x="0" y="115" width="300" height="50" rx="6"/>
<text class="s" x="16" y="146">a channel member</text><text class="t" x="284" y="145" text-anchor="end">in #perch</text>

<rect class="f" x="0" y="185" width="300" height="50" rx="6"/>
<text class="s" x="16" y="216">a bot</text><text class="t" x="284" y="215" text-anchor="end">in #perch</text>
<path class="thin d" d="M300 210 H530"/><path d="M532 202 L548 218 M548 202 L532 218"/>
<rect class="f" x="0" y="255" width="300" height="50" rx="6"/>

<rect class="f" x="0" y="325" width="300" height="50" rx="6"/>
<text class="s" x="16" y="356">anyone</text><text class="t" x="284" y="355" text-anchor="end">direct messages</text>
<path class="thin d" d="M300 350 H530"/><path d="M532 342 L548 358 M548 342 L532 358"/>
<rect class="f" x="820" y="40" width="284" height="130" rx="4"/>
<path d="M820 66 H1104"/>
<circle cx="836" cy="53" r="3"/><circle cx="850" cy="53" r="3"/><circle cx="864" cy="53" r="3"/>

<path class="thin" d="M584 204 H596 V356 H584"/>
